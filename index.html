<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Marta's Wardrobe">
  <title>Marta's Wardrobe</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;1,300;1,400&family=DM+Sans:wght@300;400&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body { font-family: 'DM Sans', sans-serif; font-weight: 300; background: #faf9f7; color: #1a1a1a; min-height: 100dvh; display: flex; flex-direction: column; }
    .header { padding: 56px 20px 12px; border-bottom: 0.5px solid #e0ddd8; display: flex; align-items: baseline; gap: 10px; background: #faf9f7; position: sticky; top: 0; z-index: 10; }
    .header h1 { font-family: 'Cormorant Garamond', serif; font-size: 24px; font-weight: 300; font-style: italic; }
    .header span { font-size: 11px; color: #888; letter-spacing: 0.1em; text-transform: uppercase; }
    .tabs { display: flex; border-bottom: 0.5px solid #e0ddd8; background: #faf9f7; position: sticky; top: 64px; z-index: 9; }
    .tab { flex: 1; padding: 10px 4px; font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; text-align: center; border: none; background: transparent; color: #999; cursor: pointer; border-bottom: 1.5px solid transparent; transition: all 0.15s; font-family: 'DM Sans', sans-serif; }
    .tab.active { color: #1a1a1a; border-bottom-color: #1a1a1a; }
    .view { display: none; flex: 1; flex-direction: column; }
    .view.active { display: flex; }
    .cats { display: flex; gap: 6px; padding: 12px 16px; overflow-x: auto; scrollbar-width: none; }
    .cats::-webkit-scrollbar { display: none; }
    .cat-btn { white-space: nowrap; font-size: 11px; letter-spacing: 0.07em; text-transform: uppercase; padding: 5px 12px; border: 0.5px solid #ccc; background: transparent; color: #888; border-radius: 20px; cursor: pointer; font-family: 'DM Sans', sans-serif; transition: all 0.15s; }
    .cat-btn.active { background: #1a1a1a; color: #faf9f7; border-color: #1a1a1a; }
    .clothes-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 0 16px 24px; overflow-y: auto; flex: 1; }
    .cloth-card { aspect-ratio: 3/4; border-radius: 10px; overflow: hidden; border: 0.5px solid #e0ddd8; background: #f0ede8; cursor: pointer; position: relative; transition: border-color 0.15s; }
    .cloth-card.selected { border: 2px solid #1a1a1a; }
    .cloth-card img { width: 100%; height: 100%; object-fit: cover; }
    .cloth-label { position: absolute; bottom: 0; left: 0; right: 0; background: rgba(250,249,247,0.92); font-size: 9px; letter-spacing: 0.05em; text-transform: uppercase; padding: 4px 6px; color: #666; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .cloth-check { position: absolute; top: 6px; right: 6px; width: 20px; height: 20px; background: #1a1a1a; border-radius: 50%; display: none; align-items: center; justify-content: center; }
    .cloth-card.selected .cloth-check { display: flex; }
    .cloth-check svg { width: 10px; height: 10px; }
    .upload-card { aspect-ratio: 3/4; border-radius: 10px; border: 0.5px dashed #bbb; background: transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; color: #bbb; font-size: 10px; letter-spacing: 0.07em; text-transform: uppercase; cursor: pointer; font-family: 'DM Sans', sans-serif; }
    .upload-plus { font-size: 26px; font-weight: 200; line-height: 1; color: #bbb; }
    .analyzing-overlay { position: absolute; inset: 0; background: rgba(250,249,247,0.8); display: flex; align-items: center; justify-content: center; border-radius: 10px; }
    .outfit-view { padding: 16px; overflow-y: auto; flex: 1; }
    .outfit-empty { text-align: center; padding: 40px 20px; color: #bbb; font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 16px; }
    .outfit-slot { display: flex; align-items: center; gap: 12px; padding: 10px; border: 0.5px solid #e0ddd8; border-radius: 10px; margin-bottom: 8px; background: #fff; }
    .slot-img { width: 42px; height: 56px; border-radius: 6px; object-fit: cover; flex-shrink: 0; }
    .slot-info { flex: 1; min-width: 0; }
    .slot-cat { font-size: 9px; letter-spacing: 0.1em; text-transform: uppercase; color: #aaa; }
    .slot-name { font-size: 13px; color: #1a1a1a; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .slot-remove { background: none; border: none; cursor: pointer; color: #ccc; font-size: 20px; line-height: 1; padding: 4px; }
    .rate-btn { width: 100%; margin-top: 16px; padding: 14px; font-family: 'Cormorant Garamond', serif; font-size: 17px; font-style: italic; background: #1a1a1a; color: #faf9f7; border: none; border-radius: 10px; cursor: pointer; letter-spacing: 0.03em; transition: opacity 0.15s; }
    .rate-btn:disabled { opacity: 0.35; cursor: not-allowed; }
    .feedback { margin-top: 14px; background: #fff; border: 0.5px solid #e0ddd8; border-radius: 10px; padding: 14px; font-size: 13px; line-height: 1.65; color: #555; }
    .feedback.loading { display: flex; align-items: center; gap: 10px; font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 15px; color: #aaa; }
    .score { font-family: 'Cormorant Garamond', serif; font-size: 32px; font-weight: 300; font-style: italic; display: block; margin-bottom: 6px; color: #1a1a1a; }
    .spinner { width: 16px; height: 16px; border: 1.5px solid #ddd; border-top-color: #888; border-radius: 50%; animation: spin 0.8s linear infinite; flex-shrink: 0; }
    @keyframes spin { to { transform: rotate(360deg); } }
    input[type="file"] { display: none; }
  </style>
</head>
<body>
<div class="header">
  <h1>Marta's Wardrobe</h1>
  <span>Virtual styling</span>
</div>
<input type="file" id="fileInput" accept="image/*">
<div class="tabs">
  <button class="tab active" onclick="switchTab('wardrobe', this)">Wardrobe</button>
  <button class="tab" onclick="switchTab('outfit', this)">Outfit</button>
</div>
<div class="view active" id="view-wardrobe">
  <div class="cats">
    <button class="cat-btn active" onclick="setCategory('all', this)">All</button>
    <button class="cat-btn" onclick="setCategory('top', this)">Tops</button>
    <button class="cat-btn" onclick="setCategory('bottom', this)">Bottoms</button>
    <button class="cat-btn" onclick="setCategory('dress', this)">Dresses</button>
    <button class="cat-btn" onclick="setCategory('outerwear', this)">Outerwear</button>
    <button class="cat-btn" onclick="setCategory('shoes', this)">Shoes</button>
    <button class="cat-btn" onclick="setCategory('accessory', this)">Accessories</button>
  </div>
  <div class="clothes-grid" id="clothesGrid"></div>
</div>
<div class="view" id="view-outfit">
  <div class="outfit-view">
    <div id="outfitSlots"></div>
    <button class="rate-btn" id="rateBtn" onclick="rateOutfit()" disabled>Rate this look ✦</button>
    <div id="feedbackBox" class="feedback" style="display:none;"></div>
  </div>
</div>
<script>
const GEMINI_KEY = 'PASTE_YOUR_KEY_HERE';
const CATS = ['top','bottom','dress','outerwear','shoes','accessory'];
const ORDER = ['outerwear','top','dress','bottom','shoes','accessory'];
let items = JSON.parse(localStorage.getItem('marta_items') || '[]');
let outfit = JSON.parse(localStorage.getItem('marta_outfit') || '{}');
let activeCategory = 'all';

function save() {
  localStorage.setItem('marta_items', JSON.stringify(items));
  localStorage.setItem('marta_outfit', JSON.stringify(outfit));
}

function switchTab(name, btn) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('view-' + name).classList.add('active');
  if (name === 'outfit') renderOutfit();
}

function setCategory(cat, btn) {
  activeCategory = cat;
  document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderGrid();
}

function renderGrid() {
  const grid = document.getElementById('clothesGrid');
  const visible = activeCategory === 'all' ? items : items.filter(i => i.category === activeCategory);
  grid.innerHTML = '';
  const addCard = document.createElement('button');
  addCard.className = 'upload-card';
  addCard.onclick = () => document.getElementById('fileInput').click();
  addCard.innerHTML = '<span class="upload-plus">+</span><span>Add piece</span>';
  grid.appendChild(addCard);
  visible.forEach(item => {
    const card = document.createElement('div');
    card.className = 'cloth-card' + (outfit[item.category]?.id === item.id ? ' selected' : '');
    card.onclick = () => toggleItem(item);
    card.innerHTML = '<img src="' + item.src + '" alt="' + item.name + '"><div class="cloth-label">' + item.name + '</div><div class="cloth-check"><svg viewBox="0 0 10 10" fill="none" stroke="white" stroke-width="1.8"><polyline points="1.5,5 4,7.5 8.5,2.5"/></svg></div>';
    if (item.analyzing) {
      const ov = document.createElement('div');
      ov.className = 'analyzing-overlay';
      ov.innerHTML = '<div class="spinner"></div>';
      card.appendChild(ov);
    }
    grid.appendChild(card);
  });
}

function toggleItem(item) {
  if (outfit[item.category]?.id === item.id) { delete outfit[item.category]; }
  else { outfit[item.category] = item; }
  document.getElementById('feedbackBox').style.display = 'none';
  save(); renderGrid(); updateRateBtn();
}

function updateRateBtn() {
  const btn = document.getElementById('rateBtn');
  if (btn) btn.disabled = Object.keys(outfit).length < 2;
}

function renderOutfit() {
  const panel = document.getElementById('outfitSlots');
  panel.innerHTML = '';
  const hasItem = ORDER.some(c => outfit[c]);
  if (!hasItem) { panel.innerHTML = '<div class="outfit-empty">Select pieces from your wardrobe to build a look</div>'; }
  else {
    ORDER.forEach(cat => {
      if (!outfit[cat]) return;
      const item = outfit[cat];
      const slot = document.createElement('div');
      slot.className = 'outfit-slot';
      slot.innerHTML = '<img class="slot-img" src="' + item.src + '" alt="' + item.name + '"><div class="slot-info"><div class="slot-cat">' + cat + '</div><div class="slot-name">' + item.name + '</div></div><button class="slot-remove" onclick="removeSlot(\'' + cat + '\')">×</button>';
      panel.appendChild(slot);
    });
  }
  updateRateBtn();
}

function removeSlot(cat) { delete outfit[cat]; save(); renderOutfit(); renderGrid(); }

async function callGemini(prompt, imageBase64, mimeType) {
  const parts = [];
  if (imageBase64) parts.push({ inlineData: { mimeType: mimeType || 'image/jpeg', data: imageBase64 } });
  parts.push({ text: prompt });
  const resp = await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=' + GEMINI_KEY, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ contents: [{ parts }] })
  });
  const data = await resp.json();
  return data.candidates?.[0]?.content?.parts?.[0]?.text || '';
}

document.getElementById('fileInput').addEventListener('change', async e => {
  const file = e.target.files[0];
  if (!file) return;
  e.target.value = '';
  const reader = new FileReader();
  reader.onload = async ev => {
    const src = ev.target.result;
    const base64 = src.split(',')[1];
    const mimeType = file.type || 'image/jpeg';
    const tempId = Date.now();
    items.unshift({ id: tempId, src, name: '...', category: 'top', analyzing: true });
    renderGrid();
    try {
      const text = await callGemini('Categorize this clothing item. Reply ONLY with JSON: {"name":"short name 2-4 words","category":"top|bottom|dress|outerwear|shoes|accessory"}. No markdown.', base64, mimeType);
      let parsed = { name: 'Item', category: 'top' };
      try { parsed = JSON.parse(text.replace(/```json|```/g, '').trim()); } catch {}
      if (!CATS.includes(parsed.category)) parsed.category = 'top';
      const idx = items.findIndex(i => i.id === tempId);
      if (idx !== -1) items[idx] = { id: tempId, src, name: parsed.name, category: parsed.category, analyzing: false };
    } catch {
      const idx = items.findIndex(i => i.id === tempId);
      if (idx !== -1) items[idx].analyzing = false;
    }
    save(); renderGrid();
  };
  reader.readAsDataURL(file);
});

async function rateOutfit() {
  const pieces = Object.values(outfit);
  if (pieces.length < 2) return;
  const fb = document.getElementById('feedbackBox');
  fb.style.display = 'block';
  fb.className = 'feedback loading';
  fb.innerHTML = '<div class="spinner"></div><span>Analysing the look…</span>';
  const desc = pieces.map(p => p.category + ': ' + p.name).join(', ');
  try {
    const text = await callGemini('I am putting together an outfit: ' + desc + '. Rate it from 1-10 and give 2-3 sentences of honest chic fashion editor feedback. Start with the score like "8/10".');
    const match = text.match(/(\d+)\s*\/\s*10/);
    fb.className = 'feedback';
    if (match) {
      const rest = text.replace(/\d+\s*\/\s*10/, '').trim();
      fb.innerHTML = '<span class="score">' + match[1] + '/10</span><span style="font-size:13px;line-height:1.65;">' + rest + '</span>';
    } else {
      fb.innerHTML = '<span style="font-size:13px;line-height:1.65;">' + text + '</span>';
    }
  } catch {
    fb.className = 'feedback';
    fb.innerHTML = 'Could not reach the style engine. Try again.';
  }
}

renderGrid();
updateRateBtn();
</script>
</body>
</html>
